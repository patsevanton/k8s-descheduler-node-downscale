{{- if .Values.businessApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "demo-app.fullname" . }}-business-app
  labels:
    app.kubernetes.io/component: business-app
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.businessApp.replicaCount }}
  selector:
    matchLabels:
      {{- include "demo-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: business-app
  template:
    metadata:
      labels:
        {{- include "demo-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: business-app
    spec:
      serviceAccountName: {{ include "demo-app.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.businessApp.terminationGracePeriodSeconds }}
      containers:
      - name: app
        image: {{ include "demo-app.image" (merge (dict "registry" $.Values.imageRegistry) .Values.businessApp.image) | quote }}
        imagePullPolicy: {{ .Values.businessApp.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.businessApp.service.port }}
          name: http
        env:
        {{- range $k, $v := .Values.businessApp.env }}
        - name: {{ $k }}
          value: {{ $v | quote }}
        {{- end }}
        readinessProbe:
          httpGet:
            path: {{ .Values.businessApp.probes.readiness.path }}
            port: {{ .Values.businessApp.probes.readiness.port }}
          initialDelaySeconds: 2
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: {{ .Values.businessApp.probes.liveness.path }}
            port: {{ .Values.businessApp.probes.liveness.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.businessApp.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "demo-app.fullname" . }}-business-app
  labels:
    app.kubernetes.io/component: business-app
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.businessApp.service.type }}
  selector:
    {{- include "demo-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: business-app
  ports:
  - name: http
    port: {{ .Values.businessApp.service.port }}
    targetPort: http
---
{{- if .Values.businessApp.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "demo-app.fullname" . }}-business-app
  labels:
    app.kubernetes.io/component: business-app
    {{- include "demo-app.labels" . | nindent 4 }}
spec:
  {{- if .Values.businessApp.pdb.minAvailable }}
  minAvailable: {{ .Values.businessApp.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.businessApp.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "demo-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: business-app
{{- end }}
{{- end }}
